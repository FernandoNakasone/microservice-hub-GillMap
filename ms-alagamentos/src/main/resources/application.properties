spring.application.name=ms-alagamentos

spring.flyway.enabled=false
spring.profiles.active=test
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}

resilience4j.circuitbreaker.instances.atualizarRegiao.slidingWindowSize=3
resilience4j.circuitbreaker.instances.atualizarRegiao.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.atualizarRegiao.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.atualizarRegiao.failureRateThreshold=50
resilience4j.circuitbreaker.instances.atualizarRegiao.waitDurationInOpenState=50s
resilience4j.circuitbreaker.instances.atualizarRegiao.permittedNumberOfCallsInHalfOpenState=2
